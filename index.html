<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoMinutes · AI Meeting Minutes & Action Items</title>
    <meta
      name="description"
      content="Upload any meeting transcript and let AI turn it into a clear summary, key decisions, and trackable action items — no recording required."
    />
    <meta name="theme-color" content="#7e14ff" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="AutoMinutes · AI Meeting Minutes & Action Items" />
    <meta
      property="og:description"
      content="Upload any meeting transcript and let AI turn it into a clear summary, key decisions, and trackable action items — no recording required."
    />
    <meta property="og:image" content="/favicon.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AutoMinutes · AI Meeting Minutes & Action Items" />
    <meta
      name="twitter:description"
      content="Upload any meeting transcript and let AI turn it into a clear summary, key decisions, and trackable action items — no recording required."
    />
    <meta name="twitter:image" content="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>

    <script>
      (function () {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = stored ? stored === 'dark' : prefersDark;
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
